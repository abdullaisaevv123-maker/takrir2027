<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>توليد استمارة التقرير</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}body{background:#f0f2f5;margin:0;padding:20px;color:#333}.container{max-width:900px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}h1{text-align:center;color:#1e3a8a;margin-bottom:25px;font-size:24px}h3{color:#1e3a8a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full-width{grid-column:span 2}.form-group{display:flex;flex-direction:column}label{font-weight:600;margin-bottom:6px;font-size:14px;color:#4b5563}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe}.btn{background:#2563eb;color:#fff;padding:12px 25px;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:20px}.btn:disabled{background:#93c5fd}.status{margin-top:15px;text-align:center;font-weight:600;min-height:25px}.search-box{margin-top:35px;padding:20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}.search-row{display:flex;gap:10px}.search-row input{flex:1}.search-btn{background:#16a34a;color:#fff;border:0;border-radius:8px;padding:10px 25px;cursor:pointer;font-weight:700;font-size:15px}.search-result{margin-top:15px}.result-card{background:#fff;border:1px solid #dbeafe;border-radius:10px;padding:18px;line-height:2}.result-row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #f1f5f9;padding:4px 0}.result-label{font-weight:700;color:#475569}.pdf-open-btn{display:inline-block;background:#16a34a;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;margin-top:12px}.error-message{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:7px;font-weight:600}.success-message{color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px;border-radius:7px;font-weight:600}.loading-message{color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:10px;border-radius:7px;font-weight:600}.pdf-list{margin-top:35px;border-top:2px solid #e5e7eb;padding-top:20px}.pdf-item{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#f8fafc;padding:10px 15px;border-radius:6px;margin-bottom:8px;border:1px solid #e2e8f0}.local-file-btn{border:0;background:#2563eb;color:#fff;padding:9px 18px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}@media(max-width:700px){body{padding:10px}.container{padding:18px}.form-grid{grid-template-columns:1fr}.full-width{grid-column:span 1}.search-row{flex-direction:column}.search-btn{width:100%}.pdf-item{flex-direction:column;align-items:flex-start}.result-row{flex-direction:column;gap:0}}
</style></head><body><div class="container"><h1>استمارة تقرير اليتيم</h1><form id="reportForm" enctype="multipart/form-data"><div class="form-grid">
<div class="form-group"><label>الدولة (Мамлекет)</label><input type="text" name="country" value="قرغيزستان" readonly style="background:#f3f4f6;font-weight:bold"></div>
<div class="form-group"><label>رقم الملف (Файл №)</label><input type="text" name="file_number" id="fileNumber" placeholder="مثال: 00125" required autocomplete="off"></div>
<div class="form-group"><label>اسم الكافل (Кафилдин аты)</label><input type="text" name="sponsor"></div>
<div class="form-group"><label>اسم اليتيم (Жетимдин аты)</label><input type="text" name="beneficiary"></div>
<div class="form-group"><label>رقم الكافل (кафилдин номери)</label><input type="text" name="beneficiary_number"></div>
<div class="form-group"><label>الرقم الداخلي (Ички номери)</label><input type="text" name="internal_number"></div>
<div class="form-group"><label>تاريخ الميلاد (Туулган жылы/күнү)</label><input type="text" name="birth_date" placeholder="DD/MM/YYYY"></div>
<div class="form-group"><label>الجنس (Жынысы)</label><select name="gender"><option value="ذكر">ذكر (Эркек)</option><option value="أنثى">أنثى (Кыз)</option></select></div>
<div class="form-group"><label>الحالة الصحية (Ден соолугу)</label><select name="health"><option value="جيد">جيد (Жакшы)</option><option value="ضعف البصر">ضعف البصر (Көзү начар көрөт)</option><option value="أمراض القلب">أمراض القلب (Жүрөк оорусу)</option><option value="حساسية">حساسية (Аллергия)</option><option value="مرض السكري">مرض السكري (Кант диабети)</option><option value="الربو">الربو (Астма)</option><option value="إعاقة حركية">إعاقة حركية (Кыймылдоо мүмкүнчүлүгү чектелген)</option><option value="مريض">مريض (Оорулуу)</option></select></div>
<div class="form-group"><label>أدرس في الصف (Классты тандоо)</label><select name="class_name"><option value="لايدرس">لا يدرس (окубайт)</option><option value="الأول">الأول (1-класс)</option><option value="الثاني">الثاني (2-класс)</option><option value="الثالث">الثالث (3-класс)</option><option value="الرابع">الرابع (4-класс)</option><option value="الخامس">الخامس (5-класс)</option><option value="السادس">السادس (6-класс)</option><option value="السابع">السابع (7-класс)</option><option value="الثامن">الثامن (8-класс)</option><option value="التاسع">التاسع (9-класс)</option><option value="العاشر">العاشر (10-класс)</option><option value="الحادي عشر">الحادي عشر (11-класс)</option><option value="طالب جامعي">طالب جامعي (Студент)</option></select></div>
<div class="form-group"><label>أمنية المستقبل (Келечектеги кыялы)</label><input type="text" name="future_wish"></div>
<div class="form-group full-width"><label>أثر الكفالة على حياة اليتيم (Кафалаттын жетимдин жашоосуна таасири)</label><textarea name="impact" rows="3"></textarea></div>
<div class="form-group full-width"><label>ملاحظات المشرف (Мушрифтин эскертүүсү)</label><textarea name="notes" rows="3"></textarea></div>
<div class="form-group full-width"><label>رابط الفيديو / الملف (Шилтеме - QR код үчүн)</label><input type="text" name="link" placeholder="https://..."></div>
<div class="form-group"><label>الصورة الشخصية (Жеке сүрөтү - photo10)</label><input type="file" name="photo10" id="photo10" accept="image/*"></div>
<div class="form-group"><label>الصورة 1 (Сүрөт 1)</label><input type="file" name="photo1" accept="image/*"></div>
<div class="form-group"><label>الصورة 2 (Сүрөт 2)</label><input type="file" name="photo2" accept="image/*"></div>
<div class="form-group"><label>الصورة 3 (Сүрөт 3)</label><input type="file" name="photo3" accept="image/*"></div>
</div><button type="submit" class="btn" id="submitBtn">إنشاء ملف PDF (PDF даярдоо)</button><div id="status" class="status"></div></form>
<div class="search-box"><h3>البحث برقم الملف (Файл № боюнча издөө)</h3><div class="search-row"><input type="text" id="searchFileNumber" placeholder="Файл № жазыңыз"><button type="button" class="search-btn" id="searchBtn">Издөө</button></div><div id="searchResult" class="search-result"></div></div>
<div class="pdf-list"><h3>الملفات التي تم إنشاؤها (Даяр болгон PDFтер):</h3><div id="filesContainer">{% for pdf in pdfs %}<div class="pdf-item"><span>{{ pdf }}</span><button type="button" class="local-file-btn" onclick="savePdf('{{ pdf }}')">تحميل (Жүктөп алуу)</button></div>{% else %}<div style="color:#64748b;text-align:center;padding:15px">Азырынча PDF түзүлө элек.</div>{% endfor %}</div></div></div>
<script>
const form=document.getElementById('reportForm'),statusDiv=document.getElementById('status'),btn=document.getElementById('submitBtn'),searchInput=document.getElementById('searchFileNumber'),searchBtn=document.getElementById('searchBtn'),searchResult=document.getElementById('searchResult');
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
form.onsubmit=async e=>{e.preventDefault();if(!document.getElementById('fileNumber').value.trim()){statusDiv.innerHTML='<div class="error-message">⚠ Файл № киргизиңиз.</div>';return}btn.disabled=true;btn.innerText='جاري المعالجة... (Даярдалууда...)';statusDiv.innerHTML='';try{const res=await fetch('/api/generate',{method:'POST',body:new FormData(form)}),data=await res.json();if(data.ok){statusDiv.innerHTML='<div class="success-message">✓ تم إنشاء الملف بنجاح!<br><strong>Файл №: '+escapeHtml(data.file_number)+'</strong><br><a href="'+data.download+'" target="_blank" style="color:#15803d;font-weight:700">اضغط هنا لتحميل الملف</a></div>';form.reset();setTimeout(()=>location.reload(),1800)}else statusDiv.innerHTML='<div class="error-message">✕ حدث خطأ: '+escapeHtml(data.error||'Белгисиз ката')+'</div>'}catch(err){statusDiv.innerHTML='<div class="error-message">✕ Сервер менен байланышууда ката кетти.</div>'}finally{btn.disabled=false;btn.innerText='إنشاء ملف PDF (PDF даярдоо)'}};
async function searchBeneficiary(){const n=searchInput.value.trim();if(!n){searchResult.innerHTML='<div class="error-message">⚠ Файл № жазыңыз.</div>';return}searchBtn.disabled=true;searchResult.innerHTML='<div class="loading-message">Изделүүдө...</div>';try{const res=await fetch('/api/search?file_number='+encodeURIComponent(n)),data=await res.json();if(!data.ok){searchResult.innerHTML='<div class="error-message">✕ '+escapeHtml(data.error||'Катталган адам табылган жок.')+'</div>';return}const b=data.beneficiary;const rows=[['Файл №',b.file_number],['اسم اليتيم',b.beneficiary],['اسم الكافل',b.sponsor],['رقم اليتيم',b.beneficiary_number],['الرقم الداخلي',b.internal_number],['تاريخ الميلاد',b.birth_date],['الجنس',b.gender],['الحالة الصحية',b.health],['الصف',b.class_name],['أمنية المستقبل',b.future_wish]];searchResult.innerHTML='<div class="result-card">'+rows.map(r=>'<div class="result-row"><span class="result-label">'+r[0]+':</span><span>'+escapeHtml(r[1]||'-')+'</span></div>').join('')+(b.pdf_url?'<a href="'+b.pdf_url+'" target="_blank" class="pdf-open-btn">📄 PDF ачуу</a>':'')+'</div>'}catch(e){searchResult.innerHTML='<div class="error-message">✕ Сервер менен байланышууда ката кетти.</div>'}finally{searchBtn.disabled=false}}searchBtn.onclick=searchBeneficiary;searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchBeneficiary()}});
async function savePdf(filename){const r=await fetch('/download/'+encodeURIComponent(filename));if(!r.ok){alert('PDF файл серверден табылган жок.');return}const blob=await r.blob();if('showSaveFilePicker'in window){try{const h=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'PDF файл',accept:{'application/pdf':['.pdf']}}]}),w=await h.createWritable();await w.write(blob);await w.close();return}catch(e){if(e.name==='AbortError')return}}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
</script></body></html>
